services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: broknowledge-app
    container_name: broknowledge-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - broknowledge-network

  db:
    image: mysql:8.0
    container_name: broknowledge-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: broknowledge
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - broknowledge-network

  nginx:
    image: nginx:alpine
    container_name: broknowledge-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - broknowledge-network

networks:
  broknowledge-network:
    driver: bridge

volumes:
  dbdata:
